:root{
  --paper:#faf7f0;
  --ink:#322f2c;
  --ink-soft:#6e6459;
  --rose:#9c6663;
  --hair:#e0d5c8;
  --wash:207,160,154;
  --pad-x:clamp(28px,8.4vw,52px);
  --mx:50%;
  --my:40%;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  height:100%;margin:0;overflow:hidden;
  background:var(--paper);color:var(--ink);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;
  touch-action:none;overscroll-behavior:none;
}

.paper{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(62% 54% at 15% 23%, rgba(var(--wash),.38), transparent 66%),
    radial-gradient(52% 46% at 63% 45%, rgba(var(--wash),.22), transparent 70%),
    radial-gradient(58% 50% at 25% 77%, rgba(var(--wash),.24), transparent 68%),
    radial-gradient(46% 40% at 88% 13%, rgba(var(--wash),.13), transparent 72%);
  animation:soakIn 3.4s ease-out both;
}
@keyframes soakIn{from{opacity:0}to{opacity:1}}

.deck{position:fixed;inset:0;z-index:1;overflow:hidden}
.deck::before{
  content:"";position:absolute;left:0;right:0;top:0;height:56px;z-index:3;
  background:linear-gradient(to bottom, rgba(90,70,55,.055), transparent);
  pointer-events:none;opacity:0;transition:opacity .8s ease;
}
.deck.turning::before{opacity:1}

.leaf{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;
  padding:clamp(38px,9vw,70px) var(--pad-x) calc(clamp(46px,11vw,84px) + env(safe-area-inset-bottom));
  opacity:0;transform:translateY(5.5%) scale(.993);
  transition:opacity 1.05s ease, transform 1.3s cubic-bezier(.16,.72,.24,1);
  pointer-events:none;will-change:opacity,transform;
}
.leaf.active{opacity:1;transform:none;pointer-events:auto}
.leaf.past{opacity:0;transform:translateY(-6.5%) scale(.986)}

.meta{display:flex;align-items:center;gap:clamp(12px,3.4vw,18px);flex:0 0 auto}
.rule{display:block;width:clamp(34px,9.5vw,52px);height:1px;background:#c9b9af;flex:0 0 auto}
.label{font-size:clamp(10px,2.9vw,13px);letter-spacing:.36em;color:#8e5955;line-height:1;padding-top:.12em}

/* 开场 */
.opener{margin-top:clamp(76px,20vh,150px)}
.say{margin:0;font-size:clamp(25px,7.3vw,34px);line-height:1.86;letter-spacing:.02em;max-width:100%}
.say .ln{
  display:block;opacity:0;transform:translateY(12px);filter:blur(0);
  transition:opacity 1.1s ease, transform 1.25s cubic-bezier(.16,.72,.24,1), filter 1.2s ease;
  transition-delay:calc(var(--d,0) * 150ms + 200ms);
}
.leaf[data-ink="0"] .ln{filter:blur(9px);transform:scale(1.03)}
.leaf.active .ln{opacity:1;transform:none;filter:blur(0)}
.say .gap2{margin-top:clamp(22px,5vh,38px)}

/* 改错页 */
.board{flex:1;display:flex;flex-direction:column;min-width:0;justify-content:center;margin-top:clamp(20px,5vh,48px);padding-bottom:clamp(20px,6vh,60px)}
.line{
  margin:0;width:100%;min-width:0;max-width:100%;word-break:break-word;overflow-wrap:anywhere;white-space:normal;
  font-size:clamp(19px,5.35vw,24px);
  line-height:2.15;letter-spacing:.02em;color:var(--ink);
  transition:opacity .7s ease;
  opacity:0;
  overflow-wrap:break-word;
}
.line.in{opacity:1}
.line.leaving{opacity:0}
.line.done .bad{color:#8e5955;border-color:transparent;animation:none}

.bad{
  color:#a8756f;cursor:pointer;
  border-bottom:1px dashed rgba(168,117,111,.62);
  padding:0 .05em;
  animation:badBreath 3.2s ease-in-out infinite;
  transition:color .6s ease, border-color .6s ease;
}
.bad.off{animation:none;color:#a8756f}
@keyframes badBreath{0%,100%{opacity:.66}50%{opacity:1}}

.miss{
  display:inline-block;min-width:1.05em;cursor:pointer;
  border-bottom:1px dashed rgba(156,102,99,.55);
  animation:badBreath 3.2s ease-in-out infinite;
}
.miss.off{animation:none}

.flip{cursor:pointer;border-bottom:1px dashed rgba(156,102,99,.42);padding:0 .04em}
.del{
  color:#a8756f;cursor:pointer;
  border-bottom:1px dashed rgba(168,117,111,.62);
  padding:0 .05em;
  animation:badBreath 3.2s ease-in-out infinite;
  transition:color .6s ease, border-color .6s ease, opacity .8s ease;
}
.del.gone{opacity:0;display:none}
.afterline{
  display:block;margin-top:.9em;
  font-size:clamp(12px,3.2vw,14px);letter-spacing:.05em;line-height:1.9;
  color:#a2937f;
  opacity:0;transform:translateY(5px);
  transition:opacity 1.2s ease, transform 1.4s cubic-bezier(.16,.72,.24,1);
}
.afterline.on{opacity:1;transform:none}

.spot{position:relative}
.hintbar{
  margin:clamp(14px,3.4vw,20px) 0 0;
  font-size:clamp(11px,2.9vw,12px);letter-spacing:.16em;color:#b09a8c;
  opacity:0;transform:translateY(4px);
  transition:opacity .8s ease, transform .9s cubic-bezier(.16,.72,.24,1);
}
.hintbar.on{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.tray{display:flex;gap:clamp(10px,2.8vw,16px);margin-top:auto;padding-bottom:clamp(6px,2vw,12px)}

.picker{
  position:fixed;z-index:9;display:flex;gap:7px;padding:7px;
  background:rgba(250,247,240,.95);
  border:1px solid rgba(156,102,99,.2);
  box-shadow:0 12px 30px -20px rgba(90,70,55,.7);
  opacity:0;pointer-events:none;transform:translateY(-5px);
  transition:opacity .28s ease, transform .28s ease;
}
.picker.on{opacity:1;pointer-events:auto;transform:none}
.pk{
  appearance:none;border:1px solid rgba(156,102,99,.22);
  background:rgba(255,255,255,.55);
  width:clamp(40px,10.5vw,46px);height:clamp(40px,10.5vw,46px);
  font:inherit;font-size:clamp(18px,5vw,22px);color:#4a4340;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  transition:background .28s ease, border-color .28s ease;
}
.pk:hover{background:rgba(255,255,255,.9);border-color:rgba(156,102,99,.4)}
.pk.wrong{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-1px)}}

.tail{
  margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;
  padding-top:clamp(16px,4.2vw,24px);border-top:1px solid var(--hair);
  min-height:clamp(38px,10vw,52px);
}
.tip{font-size:clamp(10px,2.9vw,12px);letter-spacing:.28em;color:#857867;line-height:1}
.marks{display:flex;gap:clamp(6px,1.8vw,9px);align-items:center;flex-wrap:wrap}
.marks i{width:5px;height:5px;border-radius:50%;background:#dcc9c2;transition:background .5s ease,transform .5s ease}
.marks i.done{background:#a8756f;transform:scale(1.15)}

/* 完整信 */
.full{margin:clamp(32px,8vh,70px) 0 0;width:100%;min-width:0}
.full p{
  margin:0 0 .78em;width:100%;word-break:break-word;overflow-wrap:anywhere;white-space:normal;font-size:clamp(12.5px,3.34vw,14px);line-height:1.92;max-width:100%;
  color:var(--ink-soft);letter-spacing:.03em;
  opacity:0;transform:translateY(8px);
  transition:opacity 1s ease, transform 1.1s cubic-bezier(.16,.72,.24,1);
  transition-delay:calc(var(--d,0) * 180ms + 200ms);
}
.leaf.active .full p{opacity:1;transform:none}
.full em{font-style:normal;color:#8e5955}

/* 写 */
.leaf-write .say{margin-top:clamp(34px,11vh,86px);font-size:clamp(24px,6.9vw,30px)}
.sub{display:block;margin-top:clamp(14px,3.6vw,20px);font-size:clamp(13px,3.6vw,15px);letter-spacing:.06em;color:var(--ink-soft);line-height:1.9}
.slip{
  position:relative;margin-top:clamp(38px,9.5vh,86px);
  padding:clamp(16px,4.4vw,22px) clamp(16px,4.4vw,22px) clamp(12px,3.4vw,16px);
  border:1px dashed #c4b4a4;border-radius:1px;
  background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16));
  transition:border-color .5s ease, background .5s ease, box-shadow .5s ease,
             transform .9s cubic-bezier(.5,0,.7,.2), opacity .8s ease;
}
.slip.focus{border-color:#b9a595;background:linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.3));box-shadow:0 8px 26px -18px rgba(90,70,55,.5)}
.slip.fold{transform:scale(.55) rotate(-7deg) translateY(-14px);opacity:0}
#msg{
  display:block;width:100%;min-height:clamp(72px,18vw,98px);
  border:0;background:transparent;resize:none;outline:none;
  font:inherit;font-size:clamp(15px,4.2vw,18px);line-height:1.9;color:var(--ink);
  user-select:text;-webkit-user-select:text;
}
#msg::placeholder{color:#c8bcae;letter-spacing:.16em}
.acts{display:flex;align-items:center;justify-content:space-between;margin-top:clamp(16px,4vw,22px)}
.fold{
  appearance:none;border:0;background:none;padding:6px 2px 7px;
  font:inherit;font-size:clamp(12px,3.3vw,14px);letter-spacing:.34em;color:var(--rose);
  border-bottom:1px solid rgba(156,102,99,.32);cursor:pointer;transition:opacity .4s ease;
}
.fold:disabled{opacity:.72;cursor:default}
.note{margin:clamp(12px,3vw,16px) 0 0;font-size:clamp(11px,3.1vw,13px);letter-spacing:.04em;line-height:1.95;color:#97897b;max-width:17em}
.inkdot{width:7px;height:7px;border-radius:50%;background:var(--rose);opacity:.06;transition:opacity .5s ease}

.sent{opacity:0;transform:translateY(9px);transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.16,.72,.24,1)}
.sent.on{opacity:1;transform:none}

/* 雾 */
.veil{
  position:fixed;left:-100%;top:-100%;width:300%;height:300%;
  z-index:6;pointer-events:none;
  background:radial-gradient(circle 300px at 50% 50%,
    rgba(255,253,247,0) 0%, rgba(251,248,241,.07) 40%,
    rgba(250,247,240,.56) 72%, rgba(250,247,240,.88) 100%);
  transform:translate3d(calc(var(--mx) - 50vw), calc(var(--my) - 50vh), 0);
  transition:transform .24s ease-out, opacity .9s ease;
}
.veil::after{
  content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;
  margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(214,176,132,.05) 0%, rgba(214,176,132,.036) 28%, rgba(214,176,132,.019) 52%, rgba(214,176,132,.006) 72%, rgba(214,176,132,0) 90%);
  mix-blend-mode:multiply;pointer-events:none;
}
body.on-fix .veil{opacity:.46}
body.on-letter .veil{opacity:.12}
body.on-write .veil{opacity:.14}
body.on-last .veil{opacity:.06}

.grain{
  position:fixed;inset:0;z-index:7;pointer-events:none;
  opacity:.055;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}

.peek{
  position:fixed;left:50%;bottom:calc(clamp(20px,5vw,32px) + env(safe-area-inset-bottom));
  z-index:8;margin-left:-3px;width:6px;height:6px;border-radius:50%;
  background:var(--rose);opacity:0;transition:opacity .9s ease;
  animation:breatheDot 3.4s ease-in-out infinite;pointer-events:auto;cursor:pointer;
}
.peek.on{opacity:.34}
@keyframes breatheDot{0%,100%{transform:translateY(0);opacity:.28}50%{transform:translateY(3px);opacity:.5}}

@media (min-width:720px){
  .leaf{padding-left:max(var(--pad-x),calc((100% - 620px)/2));padding-right:max(var(--pad-x),calc((100% - 620px)/2))}
}
@media (prefers-reduced-motion:reduce){
  .paper{animation:none}
  .leaf{transition:none}
  .leaf .ln,.full p,.line{transition:none;opacity:1;transform:none;filter:none}
  .bad,.miss{animation:none}
  .peek{animation:none}
  .veil{transition:none}
}
</style>
</head>
<body>

<div class="paper"></div>

<main class="deck" id="deck">

  <!-- 1 开场 -->
  <section class="leaf" data-ink="0">
    <div class="opener">
      <p class="say">
        <span class="ln" style="--d:0">这封信，我抄了一遍。</span>
        <span class="ln" style="--d:1">有几处，抄错了。</span>
        <span class="ln gap2" style="--d:2">我想改。</span>
        <span class="ln" style="--d:3">可我改不下去。</span>
      </p>
    </div>
    <div class="tail"><span class="tip">往下</span></div>
  </section>

  <!-- 2 改错 -->
  <section class="leaf" id="leaf-fix" data-ink="2">
    <div class="meta"><span class="rule"></span><span class="label">抄本</span></div>
    <div class="board">
      <p class="line in" id="line"></p>
      <p class="hintbar" id="hintbar">这里抄错了</p>
    </div>
    <div class="tail">
      <span class="marks" id="marks"></span>
      <span class="tip" id="prog">1 / 8</span>
    </div>
  </section>

  <!-- 3 改好了 -->
  <section class="leaf" id="leaf-letter" data-ink="3">
    <div class="full" id="full"></div>
    <div class="tail"><span class="tip">往下</span></div>
  </section>

  <!-- 4 说出 -->
  <section class="leaf" data-ink="4">
    <p class="say" style="margin-top:clamp(84px,25vh,190px)">
      <span class="ln" style="--d:0">就写到这儿。</span>
      <span class="ln" style="--d:1">剩下的，我不敢写了。</span>
    </p>
    <div class="tail"></div>
  </section>

  <!-- 5 写 -->
  <section class="leaf leaf-write" data-ink="2">
    <div class="meta"><span class="rule"></span><span class="label">最后</span></div>
    <p class="say">
      <span class="ln" style="--d:0">如果你愿意，</span>
      <span class="ln" style="--d:1">留一句给我。</span>
      <span class="sub">不写也行。我不会问第二遍。</span>
    </p>
    <div class="slip" id="slip">
      <textarea id="msg" maxlength="400" placeholder="……" aria-label="写一句话"></textarea>
    </div>
    <div class="acts">
      <button class="fold" id="fold" type="button" disabled>折起</button>
      <span class="inkdot" id="inkdot"></span>
    </div>
    <p class="note">折起来，只有我看得到。<br>不想写，直接关掉就好。</p>
  </section>

  <!-- 6 收好 -->
  <section class="leaf" id="leaf-sent" data-ink="0">
    <div class="sent" id="sentBody" style="display:none">
      <p class="say" style="margin-top:clamp(84px,26vh,200px)">
        <span class="ln" style="--d:0">收到了。</span>
        <span class="ln" style="--d:1">谢谢你写这些。</span>
        <span class="sub">剩下的，慢慢来。</span>
      </p>
    </div>
    <div class="sent on" id="endBody">
      <p class="say" style="margin-top:clamp(84px,26vh,200px)">
        <span class="ln" style="--d:0">就到这儿吧。</span>
        <span class="ln" style="--d:1">不写也没关系。</span>
        <span class="sub">我说过，不问第二遍。</span>
      </p>
    </div>
    
  </section>

</main>

<div class="picker" id="picker"></div>
<div class="veil" id="veil"></div>
<div class="grain"></div>
<div class="peek" id="peek"></div>

<script>
(function () {
  var deck = document.getElementById('deck');
  var leaves = Array.prototype.slice.call(deck.querySelectorAll('.leaf'));
  var peek = document.getElementById('peek');
  var sentBody = document.getElementById('sentBody');
  var picker = document.getElementById('picker');
  var idx = 0, lock = false, ignorePointer = 0, submitted = false;

  /* ---------- 光 ---------- */
  function place(x, y) {
    document.documentElement.style.setProperty('--mx', x + 'px');
    document.documentElement.style.setProperty('--my', y + 'px');
  }
  function lightOn(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (!r.width) return;
    ignorePointer = Date.now() + 700;
    place(r.left + r.width * 0.45, r.top + Math.min(r.height * 0.4, 180));
  }
  window.addEventListener('pointermove', function (e) {
    if (Date.now() < ignorePointer) return;
    place(e.clientX, e.clientY);
    peek.classList.add('on');
  }, { passive: true });

  /* ---------- 翻页 ---------- */
  var fixed = false;
  function paint() {
    leaves.forEach(function (l, k) {
      l.classList.remove('active', 'past');
      if (k === idx) l.classList.add('active');
      else if (k < idx) l.classList.add('past');
    });
    var last = leaves.length - 1;
    peek.classList.toggle('on', idx < last);
    document.body.classList.toggle('on-write', leaves[idx].classList.contains('leaf-write'));
    document.body.classList.toggle('on-fix', leaves[idx].id === 'leaf-fix');
    document.body.classList.toggle('on-letter', leaves[idx].id === 'leaf-letter');
    document.body.classList.toggle('on-last', idx === last);
    if (idx === last) {
      var sent = document.getElementById('sentBody');
      var end  = document.getElementById('endBody');
      if (submitted) { end.style.display = 'none'; sent.style.display = ''; sent.classList.add('on'); }
      else { sent.style.display = 'none'; end.style.display = ''; end.classList.add('on'); }
    }
    var a = leaves[idx].querySelector('.line, .say, .full');
    setTimeout(function () { lightOn(a); }, 90);
  }
  function go(n) {
    if (lock) return;
    n = Math.max(0, Math.min(leaves.length - 1, n));
    if (n === idx) return;
    if (n > idx && leaves[idx].id === 'leaf-fix' && !fixed) { nudge(); return; }
    lock = true;
    deck.classList.add('turning');
    idx = n;
    closePicker();
    paint();
    setTimeout(function () { deck.classList.remove('turning'); lock = false; }, 1180);
  }
  function nudge() {
    var p = document.getElementById('prog');
    p.textContent = '还有没改完的';
    p.style.color = '#a8756f';
    setTimeout(function () { p.textContent = (si + 1) + ' / ' + SENTS.length; p.style.color = ''; }, 1300);
  }

  var wheelAt = 0;
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = Date.now();
    if (now - wheelAt < 420 || Math.abs(e.deltaY) < 5) return;
    wheelAt = now;
    go(idx + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  var sy = 0, sx = 0, tracking = false;
  window.addEventListener('touchstart', function (e) {
    if (e.target.closest('button,textarea,.slip,.bad,.miss,.flip,.picker')) { tracking = false; return; }
    sy = e.touches[0].clientY; sx = e.touches[0].clientX; tracking = true;
    place(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    place(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dy = t.clientY - sy, dx = t.clientX - sx;
    if (Math.abs(dy) > 46 && Math.abs(dy) > Math.abs(dx)) go(idx + (dy < 0 ? 1 : -1));
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); go(idx + 1); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(leaves.length - 1); }
  });
  peek.addEventListener('click', function () { go(idx + 1); });

  /* ---------- 抄本：八句话，所有「你」都被抄成了别的字 ---------- */
  var SENTS = [
    /* 一 · 她→你 */
    { parts: ['教室里有没有', { t: 'swap', bad: '她', good: '你', opts: ['你', '她', '他', '谁'] }, '，是不一样的。'] },

    /* 二 · 缺字 */
    { parts: ['我总觉得，', { t: 'miss', good: '你', opts: ['你', '她', '谁', '人'] }, '写作业的时候特别安静。',
              { t: 'brk' }, '笔尖在纸上走，不快，但一直不停。'] },

    /* 三 · 她→你 */
    { parts: ['跟', { t: 'swap', bad: '她', good: '你', opts: ['她', '你', '人'] }, '讲话很省力。',
              { t: 'brk' }, '不用准备，也不用担心说错。'] },

    /* 四 · 她→你 */
    { parts: ['我随口问的，', { t: 'swap', bad: '她', good: '你', opts: ['她', '你', '谁'] }, '也会认真答。',
              { t: 'brk' }, '有时候答得比问的还细。'] },

    /* 五 · 多余的字（规律第一次被打断） */
    { parts: ['我想让你', { t: 'del', bad: '知道明白', good: '知道' }, '，', { t: 'brk' }, '我不是一时冲动。'],
      after: '抄的时候走了神，多写了一个词。' },

    /* 六 · 抄串行：混进了一句不相干的话 */
    { parts: ['和你说话的时候，', { t: 'brk' }, '我不用提前想好台词。', { t: 'brk' },
              '那种轻，我一直记得。', { t: 'brk' },
              { t: 'del', bad: '今天食堂有红烧肉，排了二十分钟。', good: '' }],
      after: '这句不属于这里。抄到一半，被叫去吃饭了。' },

    /* 七 · 化用《越人歌》：这里该改回的不是「你」，是「君」 */
    { parts: ['山有木兮木有枝，', { t: 'brk' },
              '心悦', { t: 'swap', bad: '她', good: '君', opts: ['君', '她', '你', '谁'] },
              '兮', { t: 'swap', bad: '她', good: '君', opts: ['君', '你', '她', '他'] }, '不知。'],
      after: '这句不是我写的。是《越人歌》，两千多年前。' },

    /* 八 · 缺字 */
    { parts: ['因为', { t: 'miss', good: '你', opts: ['你', '这', '它', '那'] }, '，我开始向往一种生活。',
              { t: 'brk' }, '不是什么大不了的生活。'] },

    /* 九 · 她→你 */
    { parts: ['这些话我改了很多遍，', { t: 'brk' },
              '才敢让', { t: 'swap', bad: '她', good: '你', opts: ['她', '你', '人', '自己'] }, '看见。'] },

    /* 十 · 她→你 */
    { parts: ['说出口就够了。', { t: 'brk' },
              { t: 'swap', bad: '她', good: '你', opts: ['我', '她', '你', '谁'] }, '不欠我一个回答。'] },

    /* 十一 · 同音字 */
    { parts: ['我一直', { t: 'swap', bad: '再', good: '在', opts: ['再', '在', '还', '又'] }, '找一个说法。',
              { t: 'brk' }, '找了很久，没找到。'] },

    /* 十二 · 最后一句 */
    { parts: ['这封信，', { t: 'brk' }, '是写给', { t: 'swap', bad: '她', good: '你', opts: ['她', '他', '你', '谁'] }, '的。'] }
  ];

  var si = 0, spots = [], active = -1, marksEl = document.getElementById('marks');
  var lineEl = document.getElementById('line'), progEl = document.getElementById('prog');
  var hintTimer = null;

  SENTS.forEach(function () { marksEl.appendChild(document.createElement('i')); });

  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  function renderSent() {
    var S = SENTS[si];
    spots = [];
    lineEl.innerHTML = '';
    lineEl.classList.add('in');
    lineEl.classList.remove('leaving', 'done');

    S.parts.forEach(function (p) {
      if (typeof p === 'string') {
        lineEl.appendChild(document.createTextNode(p));
        return;
      }
      if (p.t === 'brk') { lineEl.appendChild(document.createElement('br')); return; }

      var el = document.createElement('span');
      el.className = 'spot';

      if (p.t === 'del') {
        var dd = document.createElement('span');
        dd.className = 'del';
        dd.textContent = p.bad;
        el.appendChild(dd);
        el._ok = function () {
          if (p.good) { dd.textContent = p.good; dd.classList.remove('del'); }
          else { dd.classList.add('gone'); }
        };
        el._open = function () { el._ok(); finishSpot(el); };
      } else if (p.t === 'swap') {
        var s = document.createElement('span');
        s.className = 'bad';
        s.textContent = p.bad;
        el.appendChild(s);
        el._ok = function () {
          s.textContent = p.good;
          s.classList.remove('bad');
          s.classList.add('done');
        };
        el._open = function () { openPicker(s, p.opts, p.good, el._ok); };
      } else if (p.t === 'miss') {
        var m = document.createElement('span');
        m.className = 'miss';
        m.innerHTML = '&nbsp;';
        el.appendChild(m);
        el._ok = function () {
          m.textContent = p.good;
          m.classList.remove('miss');
          m.style.borderBottom = '0';
        };
        el._open = function () { openPicker(m, p.opts, p.good, el._ok); };
      } else if (p.t === 'flip') {
        var f = document.createElement('span');
        f.className = 'flip';
        f.textContent = p.bad;
        el.appendChild(f);
        el._ok = function () {
          f.textContent = p.good;
          f.classList.remove('flip');
        };
        el._open = function () { el._ok(); finishSpot(el); };
      }

      spots.push(el);
      lineEl.appendChild(el);
    });

    progEl.textContent = (si + 1) + ' / ' + SENTS.length;
    active = 0;
    armSpot();
    lightOn(lineEl);
  }

  function armSpot() {
    spots.forEach(function (s) {
      s.classList.remove('hintline');
      s.style.pointerEvents = 'none';
    });
    if (active >= spots.length) return;
    var el = spots[active];
    el.style.pointerEvents = 'auto';
    el.onclick = onSpotClick;
    var bar = document.getElementById('hintbar');
    if (bar) bar.classList.remove('on');
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      if (bar && active < spots.length) {
        bar.classList.add('on');
        setTimeout(function () { bar.classList.remove('on'); }, 4600);
      }
    }, 8000);
  }

  function onSpotClick(e) {
    var el = e.currentTarget;
    if (el.onclick !== onSpotClick) return;
    el._open();
  }

  function finishSpot(el) {
    active++;
    if (active >= spots.length) {
      lineEl.classList.add('done');
      marksEl.children[si].classList.add('done');
      var S = SENTS[si];
      if (S.after) {
        var af = document.createElement('span');
        af.className = 'afterline';
        af.textContent = S.after;
        lineEl.appendChild(af);
        setTimeout(function () { af.classList.add('on'); }, 420);
      }
      setTimeout(function () {
        lineEl.classList.add('leaving');
        setTimeout(function () {
          si++;
          if (si >= SENTS.length) {
            fixed = true;
            buildFull();
            go(idx + 1);
            return;
          }
          renderSent();
        }, 620);
      }, SENTS[si].after ? 3400 : 1300);
    } else {
      armSpot();
    }
  }

  /* ---------- 候选字浮层 ---------- */
  var curOk = null;
  function openPicker(anchor, opts, good, okCb) {
    var b0 = document.getElementById('hintbar');
    if (b0) b0.classList.remove('on');
    picker.innerHTML = '';
    picker.classList.add('on');
    curOk = { good: good, cb: okCb };

    shuffle(opts).forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pk';
      b.textContent = ch;
      b.addEventListener('click', function () {
        if (ch === good) {
          closePicker();
          okCb();
          finishSpot(anchor.closest('.spot'));
        } else {
          b.classList.add('wrong');
          setTimeout(function () { b.classList.remove('wrong'); }, 420);
        }
      });
      picker.appendChild(b);
    });

    var r = anchor.getBoundingClientRect();
    var pw = picker.offsetWidth;
    var left = r.left + r.width / 2 - pw / 2;
    left = Math.max(12, Math.min(window.innerWidth - pw - 12, left));
    picker.style.left = left + 'px';
    picker.style.top = (r.bottom + 12) + 'px';
  }
  function closePicker() {
    picker.classList.remove('on');
    curOk = null;
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.picker') && !e.target.closest('.spot')) closePicker();
  });

  /* ---------- 改好了：完整的一封 ---------- */
  function buildFull() {
    var box = document.getElementById('full');
    var txt = [
      '教室有窗。下午三点，光落在同一张桌上。<br>我不是先看见光的，是先看见<em>你</em>。',
      '两千多年前有人写过<em>未敢言</em>。<br>我当时不懂什么叫未敢。后来懂了。',
      '跟你说话不用准备，说完也不用回想刚才说了什么。',
      '你写作业时笔不停。<br>我数过你翻页，一节课三次。后来不敢数了。',
      '既见君子，<em>云胡不喜</em>。<br>查完这句，觉得古人真省事，八个字说完了我半年。',
      '盈盈一水间，<em>脉脉不得语</em>。<br>我们之间没有水，只有一张桌子的距离。',
      '山有木兮木有枝。重点不是木有枝，<br>是下半句：心悦君兮，<em>君不知</em>。',
      '我改了很多遍，每遍都比上遍短。<br>最后只剩一句：我好像，一直在<em>等你抬头</em>。',
      '和你相处时，我开始向往一种生活。<br>不大。一张桌，两盏灯，不说话也不尴尬。',
      '说出口就够了。<em>你</em>不欠我一个回答。<br>当没看见，也行。',
      '这封信没有落款。<br>写名字这件事，我练了很多遍，一直没练好。'
    ];
    box.innerHTML = '';
    txt.forEach(function (t, i) {
      var p = document.createElement('p');
      p.style.setProperty('--d', i);
      p.innerHTML = t;
      box.appendChild(p);
    });
  }

  /* ---------- 写 ---------- */
  var slip = document.getElementById('slip');
  var msg  = document.getElementById('msg');
  var fold = document.getElementById('fold');
  var inkdot = document.getElementById('inkdot');
  var TO = '3586651932@qq.com';

  msg.addEventListener('focus', function () { slip.classList.add('focus'); lightOn(slip); });
  msg.addEventListener('blur', function () { slip.classList.remove('focus'); });
  msg.addEventListener('input', function () {
    var n = msg.value.replace(/\s/g, '').length;
    fold.disabled = n === 0;
    inkdot.style.opacity = (0.08 + Math.min(n / 70, 1) * 0.42).toFixed(3);
  });

  function settle() {
    submitted = true;
    slip.classList.add('fold');
    fold.disabled = true;
    msg.setAttribute('readonly', 'readonly');
    setTimeout(function () {
      slip.style.visibility = 'hidden';
      idx = leaves.length - 1;
      paint();
      setTimeout(function () { sentBody.classList.add('on'); }, 420);
    }, 820);
  }

  fold.addEventListener('click', function () {
    var text = msg.value.trim();
    if (!text) return;
    fold.disabled = true;
    fold.textContent = '正在折…';
    fetch('https://formsubmit.co/ajax/' + TO, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: '她留了一句话',
        message: text,
        at: new Date().toLocaleString('zh-CN', { hour12: false })
      })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (String(d && d.success) === 'true') { settle(); }
        else { throw new Error('nope'); }
      })
      .catch(function () {
        fold.textContent = '折起';
        fold.disabled = false;
        var nt = document.querySelector('.note');
        nt.innerHTML = '这会儿还没连上。<br>你可以先把这句话复制走。';
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            nt.innerHTML = '这会儿还没连上。<br>已经替你复制好了。';
          }).catch(function () {});
        }
      });
  });

  /* ---------- 起步 ---------- */
  var q = location.search.match(/[?&]p=(\d+)/);
  if (q) {
    var qn = parseInt(q[1], 10) - 1;
    idx = Math.max(0, Math.min(leaves.length - 1, qn));
    if (idx > 1) { fixed = true; buildFull(); }
  }
  var qs = location.search.match(/[?&]s=(\d+)/);
  if (qs) {
    si = Math.max(0, Math.min(SENTS.length - 1, parseInt(qs[1], 10) - 1));
    for (var i = 0; i < si; i++) marksEl.children[i].classList.add('done');
  }
  renderSent();
  paint();
  requestAnimationFrame(function () {
    if (!document.body.classList.contains('on-fix')) {
      place(window.innerWidth * 0.5, window.innerHeight * 0.4);
    }
    setTimeout(function () { peek.classList.add('on'); }, 2400);
  });
})();
</script>

</body>
